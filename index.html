<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Treeniappi</title>
<style>
:root{
  --bg:#f3f4f6; --card:#ffffff; --text:#111827; --muted:#6b7280; --border:#e5e7eb; --soft:#f9fafb;
  --accent:#0f766e; --accent-soft:#ccfbf1; --accent-text:#ffffff; --danger:#dc2626; --warn:#d97706; --ok:#16a34a;
  --k-gym:#2563eb; --k-run:#16a34a; --k-swim:#0891b2; --k-func:#ea580c;
  --radius:14px; --shadow:0 1px 2px rgba(0,0,0,.05),0 1px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0b0f14; --card:#151b23; --text:#e5e7eb; --muted:#9ca3af; --border:#273140; --soft:#1b2330;
    --accent:#14b8a6; --accent-soft:#134e4a; --accent-text:#04201d; --shadow:none; }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.modal-open{overflow:hidden}
main{max-width:720px;margin:0 auto;padding:12px 16px calc(96px + env(safe-area-inset-bottom))}
h1{font-size:1.6rem;margin:6px 0 12px;letter-spacing:-.01em}
h2{font-size:1.1rem;margin:0 0 8px}
h3{font-size:1rem;margin:0}
a{color:var(--accent)}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.muted{color:var(--muted)} .small{font-size:.85rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin:0 0 12px;box-shadow:var(--shadow)}
.sec-row{display:flex;align-items:center;justify-content:space-between;margin:18px 0 8px;gap:8px}
.sec-row h2{margin:0}
.group-h{display:flex;align-items:center;gap:8px;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 2px 8px}
.k-gym{--k:var(--k-gym)} .k-run{--k:var(--k-run)} .k-swim{--k:var(--k-swim)} .k-func{--k:var(--k-func)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none;background:var(--k,var(--accent))}
button{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:11px;border:1px solid var(--border);background:var(--card);font-weight:600;cursor:pointer;text-decoration:none}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--border))}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent)}
.btn.small{min-height:36px;padding:0 12px;font-size:.9rem;border-radius:9px}
.btn.block{width:100%}
.icon-btn{border:0;background:transparent;width:40px;height:40px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--soft)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.badge{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:999px;background:#fef3c7;color:#92400e}
.tag{font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--k,var(--accent)) 14%,transparent);color:var(--k,var(--accent));white-space:nowrap}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px;border-radius:12px;border:1px solid var(--border);background:var(--soft);cursor:pointer;font-size:.8rem;font-weight:600}
.quick-btn .ic{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--k) 15%,transparent);color:var(--k)}
.quick-btn .ic svg{width:22px;height:22px}
.tpl{border-left:4px solid var(--k)}
.tpl-head{display:flex;align-items:center;gap:8px}
.tpl-head h3{font-size:1.15rem;flex:1;min-width:0;overflow-wrap:anywhere}
.ex-list{margin:8px 0 10px;padding-left:22px}
.ex-list li{padding:1px 0}
.ex-list .tgt{color:var(--muted);font-size:.85rem;margin-left:6px}
.tpl-meta{font-size:.85rem;color:var(--muted);margin:6px 0 10px}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty b{color:var(--text)}
.slist{display:flex;flex-direction:column;gap:8px}
.srow{display:flex;align-items:stretch;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px;cursor:pointer;box-shadow:var(--shadow)}
.srow .kbar{width:4px;border-radius:4px;background:var(--k);flex:none}
.srow-main{flex:1;min-width:0}
.srow-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.srow-top b{overflow-wrap:anywhere}
.srow-sub{font-size:.85rem;color:var(--muted);margin-top:2px}
.srow-date{font-size:.8rem;color:var(--muted);white-space:nowrap;align-self:center}
.month-h{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 2px 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span,.chip-btn{display:inline-flex;align-items:center;gap:4px;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--border);background:var(--card);font-size:.9rem;font-weight:500;cursor:pointer;user-select:none}
.chip input:checked + span{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.chip input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.chip-btn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.chip-btn.dashed{border-style:dashed;color:var(--muted)}
.scroll-x{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.scroll-x::-webkit-scrollbar{display:none}
.scroll-x .chip-btn{flex:none}
label.f{display:block;margin:0 0 12px}
label.f > span,.f-label{display:block;font-size:.82rem;font-weight:600;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=search],input[type=date],input[type=number],select,textarea{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;min-height:44px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:0;border-color:var(--accent)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.row4 input{padding:10px 8px}
.calc{display:flex;align-items:center;justify-content:space-between;background:var(--accent-soft);color:var(--text);border-radius:10px;padding:10px 12px;margin:0 0 12px;font-weight:600}
.calc b{font-size:1.1rem}
.calc.col{flex-direction:column;align-items:flex-start;gap:2px}
.calc.col span{font-size:.8rem;color:var(--muted)}
.hint{font-size:.8rem;color:var(--muted);margin-top:4px}
[hidden]{display:none!important}
.ex-block{border:1px solid var(--border);border-radius:12px;padding:10px;margin:0 0 10px;background:var(--soft)}
.ex-head{display:flex;gap:6px;align-items:center}
.ex-head input{font-weight:600}
.ex-prev{font-size:.8rem;color:var(--muted);margin:6px 2px}
.set-grid-h,.set-row{display:grid;grid-template-columns:34px 1fr 1fr 40px;gap:6px;align-items:center}
.set-grid-h{font-size:.75rem;color:var(--muted);font-weight:600;margin:4px 0 2px}
.set-row{margin-bottom:6px}
.set-no{text-align:center;font-weight:700;color:var(--muted)}
.set-row input{text-align:center}
.tpl-ex-row{display:grid;grid-template-columns:1fr 92px 40px;gap:6px;margin-bottom:6px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--soft);border:1px solid var(--border);border-radius:12px;padding:4px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0}
.seg span{display:block;text-align:center;padding:8px 2px;border-radius:9px;font-size:.82rem;font-weight:600;cursor:pointer}
.seg input:checked + span{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12);color:var(--accent)}
.chart{margin:6px 0 2px}
.chart svg{display:block;max-width:100%;height:auto;overflow:visible}
.chart .grid{stroke:var(--border);stroke-width:1}
.chart .axis-t{fill:var(--muted);font-size:11px;font-family:inherit}
.chart .pt{cursor:pointer}
.chart-tip{font-size:.82rem;color:var(--muted);min-height:1.3em;text-align:center}
.chart-empty{padding:26px;text-align:center;color:var(--muted);font-size:.9rem;background:var(--soft);border-radius:10px}
.stats{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.85rem;color:var(--muted);margin:4px 0}
.stats b{color:var(--text)}
.up{color:var(--ok)!important} .down{color:var(--danger)!important}
.tbl-wrap{overflow-x:auto;margin-top:6px}
table.tbl{width:100%;border-collapse:collapse;font-size:.85rem}
.tbl th,.tbl td{padding:6px 6px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}
.tbl th{color:var(--muted);font-weight:600;font-size:.72rem;text-transform:uppercase;letter-spacing:.03em}
.tbl td.num,.tbl th.num{text-align:right}
.tbl td.wrap{white-space:normal;min-width:120px}
details summary.sum{cursor:pointer;color:var(--accent);font-weight:600;font-size:.88rem;padding:4px 0}
.datenav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:4px}
.datenav .d{text-align:center;font-weight:700}
.datenav .d small{display:block;font-weight:500;color:var(--muted);font-size:.8rem}
.kcal-big{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.kcal-big .v{font-size:2rem;font-weight:800;letter-spacing:-.02em}
.kcal-big .g{color:var(--muted);font-weight:600}
.bar{height:12px;background:var(--soft);border:1px solid var(--border);border-radius:999px;overflow:hidden;margin:8px 0 6px}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
.bar.over > i{background:var(--danger)}
.bar.thin{height:7px;margin:4px 0}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:10px}
.macro .lbl{font-size:.75rem;color:var(--muted);font-weight:600}
.macro .val{font-size:.9rem;font-weight:700}
.macro .bar > i{background:var(--mc)}
.food-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--border)}
.meal-h + .food-item{border-top:0}
.food-item .n{flex:1;min-width:0}
.food-item .n div:first-child{font-weight:600;overflow-wrap:anywhere}
.food-item .k{font-weight:700;white-space:nowrap}
.meal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.meal-h h3{font-size:.95rem}
.type-chip{display:inline-flex;align-items:center;gap:2px;min-height:32px;padding:0 4px 0 12px;border-radius:999px;border:1px solid var(--border);background:var(--soft);font-size:.88rem}
.type-chip button{border:0;background:transparent;width:28px;height:28px;border-radius:50%;cursor:pointer;color:var(--muted);font-size:1.1rem;line-height:1}
.add-inline{display:flex;gap:6px;margin-top:8px}
.add-inline input{flex:1}
.set-list .btn{margin:0 0 8px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;color:var(--muted);font-size:.7rem;font-weight:600;cursor:pointer;text-decoration:none}
.tab svg{width:24px;height:24px}
.tab.active{color:var(--accent)}
#modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
#modal[hidden]{display:none!important}
.sheet{background:var(--bg);width:100%;max-width:600px;max-height:96vh;max-height:96dvh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 8px 18px;border-bottom:1px solid var(--border);background:var(--card)}
.sheet-head h2{margin:0;font-size:1.1rem}
.sheet-body{overflow-y:auto;padding:14px 16px 8px;flex:1;-webkit-overflow-scrolling:touch}
.sheet-foot{display:flex;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--border);background:var(--card)}
.sheet-foot .spacer{flex:1}
@media (min-width:700px){ #modal{align-items:center} .sheet{border-radius:18px;max-height:90vh} main{padding-top:20px} }
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;background:#111827;color:#fff;padding:10px 14px;border-radius:12px;font-size:.92rem;box-shadow:0 6px 24px rgba(0,0,0,.25);display:flex;gap:12px;align-items:center;max-width:92vw}
#toast[hidden]{display:none!important}
#toast.err{background:var(--danger)}
#toast button{background:transparent;border:0;color:#5eead4;font-weight:700;cursor:pointer;padding:0}
.scan-btn{gap:10px;border-color:var(--accent);color:var(--accent);font-size:1rem}
.scan-btn svg{width:24px;height:24px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.8rem;margin:12px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--border)}
.scan-view{position:relative;width:100%;aspect-ratio:4/3;background:#000;border-radius:14px;overflow:hidden;margin-bottom:10px}
.scan-view video{width:100%;height:100%;object-fit:cover;display:block}
.scan-guide{position:absolute;left:8%;right:8%;top:30%;bottom:30%;border:3px solid rgba(255,255,255,.85);border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.25)}
.scan-guide i{position:absolute;left:6px;right:6px;top:50%;height:2px;background:#ef4444;box-shadow:0 0 8px #ef4444;animation:scanline 1.6s ease-in-out infinite alternate}
@keyframes scanline{from{transform:translateY(-18px)}to{transform:translateY(18px)}}
.scan-status{text-align:center;padding:10px 6px;color:var(--muted);font-size:.92rem}
.scan-status.warn{color:var(--text);background:#fef3c7;border-radius:10px;padding:12px;color:#78350f}
.notice{background:#fef3c7;color:#78350f;border-radius:10px;padding:10px 12px;font-size:.88rem;margin-bottom:12px}
.prod-head{display:flex;gap:12px;align-items:center;margin-bottom:12px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px}
.prod-head img,.prod-ph{width:64px;height:64px;object-fit:contain;border-radius:8px;background:#fff;flex:none}
.prod-ph{display:flex;align-items:center;justify-content:center;color:var(--muted);background:var(--soft)}
.prod-name{font-weight:700;font-size:1.05rem;overflow-wrap:anywhere}
.prod-head .src{color:var(--accent);margin-top:2px}
.code-ic svg{width:14px;height:14px;vertical-align:-2px;color:var(--muted)}
.meal-row{display:grid;grid-template-columns:34px 34px 1fr auto 40px;gap:4px;align-items:center;margin-bottom:6px}
.meal-row .cnt{font-size:.75rem;color:var(--muted);min-width:22px;text-align:center;background:var(--soft);border-radius:999px;padding:2px 6px}
.icon-btn.sm{width:34px;height:40px}
.icon-btn:disabled{opacity:.25;cursor:default}
.search-wrap{position:relative;margin-bottom:10px}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search-wrap input{padding-left:40px;border-radius:999px;background:var(--soft)}
.sr{border:1px solid var(--border);border-radius:12px;margin:-2px 0 12px;overflow:hidden;background:var(--card)}
.sr-sec{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px 12px 4px;background:var(--soft)}
.sr-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-top:1px solid var(--border);background:transparent;padding:8px 12px;cursor:pointer;min-height:56px}
.sr-item:active{background:var(--soft)}
.sr-item img,.sr-ph{width:40px;height:40px;border-radius:6px;object-fit:contain;background:#fff;flex:none;border:1px solid var(--border)}
.sr-ph{background:var(--soft)}
.sr-main{flex:1;min-width:0;display:flex;flex-direction:column}
.sr-name{font-weight:600;font-size:.93rem;overflow-wrap:anywhere;line-height:1.25}
.sr-sub{font-size:.78rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr-kcal{font-weight:700;white-space:nowrap;text-align:right;font-size:.95rem}
.sr-kcal small{display:block;font-weight:500;color:var(--muted);font-size:.7rem}
.sr-status{padding:12px;font-size:.88rem;color:var(--muted);text-align:center;border-top:1px solid var(--border)}
.sr-status.warn{color:#78350f;background:#fef3c7}
.sr-status .btn{margin-top:8px}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

'use strict';
/* ====================== Perusasetukset ====================== */
const STORE_KEY = 'treeniappi.v1';
const KINDS = {

};
const KIND_ORDER = ['gym','run','swim','func'];
const KIND_ICONS = {

  run:  '<circle cx="14" cy="4.5" r="1.8"/><path d="M8 21l3-6 3 2v4M6 12l3-4 4 1 2 4 3 1M11 15l1.5-5"/>',
  swim: '<path d="M2 18c2 0 2-1.5 4-1.5s2 1.5 4 1.5 2-1.5 4-1.5 2 1.5 4 1.5 2-1.5 4-1.5M2 14c2 0 2-1.5 4-1.5s2 1.5 4 1.5 2-1.5 4-1.5 2 1.5 4 1.5"/><circle cx="16" cy="6" r="1.8"/><path d="M5 11l4-4 3 3 2-2"/>',
  func: '<path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/>'

const isoOf = d => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());

const parseISO = iso => { const [y,m,d] = String(iso).split('-').map(Number); return new Date(y, (m||1)-1, d||1); };
const addDays = (iso, n) => { const d = parseISO(iso); d.setDate(d.getDate()+n); return isoOf(d); };

const monthLabel = iso => { const s = parseISO(iso).toLocaleDateString('fi-FI', {month:'long', year:'numeric'}); return s.charAt(0).toUpperCase() + s.slice(1); };
const daysBetween = (a, b) => Math.round((parseISO(b) - parseISO(a)) / DAY);
function relDays(iso){ const n = daysBetween(iso, todayISO()); if(n === 0) return 'tänään'; if(n === 1) return 'eilen'; if(n === -1) return 'huomenna'; if(n < 0) return `${-n} pv päästä`; return `${n} pv sitten`; }
function num(v){ if(v == null) return null; const s = String(v).trim().replace(/\s/g,'').replace(',', '.'); if(s === '') return null; const n = parseFloat(s); return isFinite(n) ? n : null; }
function fmtNum(n, dec=1){ if(n == null || !isFinite(n)) return '–'; return Number(n).toLocaleString('fi-FI', {maximumFractionDigits:dec}); }
function inNum(n){ return n == null ? '' : String(n).replace('.', ','); }
/* Kesto: "45" = 45 min, "45:30" = 45 min 30 s, "1:05:00" = 1 h 5 min, myös "1h 5min" */
function parseDuration(str){
  if(str == null) return null; const s = String(str).trim().replace(/\./g, ':').replace(',', '.');
  if(!s) return null;
  const hm = s.match(/^(?:(\d+)\s*h)?\s*(?:(\d+)\s*min)?$/i);
  if(hm && (hm[1] || hm[2])) return (+(hm[1]||0))*3600 + (+(hm[2]||0))*60;
  const parts = s.split(':').map(p => p.trim());
  if(parts.some(p => p === '' || isNaN(+p))) return null;
  if(parts.length === 1) return Math.round(+parts[0] * 60);
  if(parts.length === 2) return Math.round(+parts[0]*60 + +parts[1]);
  if(parts.length === 3) return Math.round(+parts[0]*3600 + +parts[1]*60 + +parts[2]);
  return null;
}
function fmtDuration(sec){ if(sec == null || !isFinite(sec)) return '–'; sec = Math.round(sec); const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60; return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`; }
function fmtPace(secPer){ if(!secPer || !isFinite(secPer)) return '–'; const t = Math.round(secPer); return `${Math.floor(t/60)}:${pad(t%60)}`; }
function icon(kind){ return `<svg class="i" viewBox="0 0 24 24">${KIND_ICONS[kind]}</svg>`; }

function isoWeek(iso){ const d = parseISO(iso); const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const dn = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - dn); const y0 = new Date(Date.UTC(t.getUTCFullYear(),0,1)); return Math.ceil(((t - y0)/DAY + 1)/7); }
function mondayOf(iso){ const d = parseISO(iso); const dn = (d.getDay()+6)%7; d.setDate(d.getDate()-dn); return isoOf(d); }

function defaultState(){
  return { version:2, templates:[], sessions:[], types:JSON.parse(JSON.stringify(DEFAULT_TYPES)), strokes:DEFAULT_STROKES.slice(),
    food:{ goals:{kcal:2500, protein:null, carbs:null, fat:null}, entries:[], meals:DEFAULT_MEALS.map(m => Object.assign({}, m)), products:{} } };
}
/* v1 -> v2: ateriat olivat kiinteitä avaimia (aamiainen, lounas, paivallinen, valipala) – samat id:t säilyvät oletusaterioissa */
function normMeals(m){
  if(!Array.isArray(m)) return DEFAULT_MEALS.map(x => Object.assign({}, x));
  const seen = new Set();
  const out = m.filter(x => x && x.id != null && String(x.name || '').trim() && !seen.has(String(x.id)) && seen.add(String(x.id))).map(x => ({id:String(x.id), name:String(x.name).trim()}));
  return out.length ? out : DEFAULT_MEALS.map(x => Object.assign({}, x));
}
function normProducts(p){
  const out = {};
  if(p && typeof p === 'object' && !Array.isArray(p)) for(const [k, v] of Object.entries(p)) if(/^\d{6,14}$/.test(k) && v && typeof v === 'object' && v.per100) out[k] = Object.assign({}, v, {code:k});
  return out;
}
function normalize(s){
  const d = defaultState(); if(!s || typeof s !== 'object') return d;
  const types = Object.assign({}, d.types);
  if(s.types && typeof s.types === 'object') for(const k of KIND_ORDER) if(Array.isArray(s.types[k]) && s.types[k].length) types[k] = s.types[k].map(String);
  return { version:2,
    templates: Array.isArray(s.templates) ? s.templates.filter(t => t && t.id && KINDS[t.kind]) : [],
    sessions: Array.isArray(s.sessions) ? s.sessions.filter(x => x && x.id && KINDS[x.kind] && x.date) : [],
    types, strokes: Array.isArray(s.strokes) && s.strokes.length ? s.strokes.map(String) : d.strokes,
    food: { goals: Object.assign({}, d.food.goals, (s.food && s.food.goals) || {}),
            entries: Array.isArray(s.food && s.food.entries) ? s.food.entries.filter(e => e && e.id && e.date) : [],
            meals: normMeals(s.food && s.food.meals), products: normProducts(s.food && s.food.products) } };
}

function gymTotals(s){ let sets = 0, vol = 0; for(const e of (s.exercises||[])) for(const st of e.sets){ sets++; vol += (st.reps||0) * (st.kg||0); } return {sets, vol}; }
function sessionSummary(s){
  const p = [];
  if(s.kind === 'gym'){ const t = gymTotals(s); p.push(`${(s.exercises||[]).length} liikettä`, `${t.sets} sarjaa`); if(t.vol) p.push(`${fmtNum(t.vol,0)} kg`); }
  if(s.kind === 'run'){ if(s.distanceKm) p.push(`${fmtNum(s.distanceKm,2)} km`); if(s.durationSec) p.push(fmtDuration(s.durationSec)); if(s.distanceKm && s.durationSec) p.push(`${fmtPace(s.durationSec/s.distanceKm)} /km`); if(s.loadKg) p.push(`kuorma ${fmtNum(s.loadKg)} kg`); if(s.hr) p.push(`syke ${s.hr}`); }
  if(s.kind === 'swim'){ if(s.distanceM) p.push(`${fmtNum(s.distanceM,0)} m`); if(s.durationSec) p.push(fmtDuration(s.durationSec)); if(s.distanceM && s.durationSec) p.push(`${fmtPace(s.durationSec/s.distanceM*100)} /100 m`); if(s.stroke) p.push(s.stroke); }
  if(s.kind === 'func'){ if(s.durationSec) p.push(fmtDuration(s.durationSec)); if(s.rounds) p.push(`${s.rounds} kierrosta`); if(s.result) p.push(`tulos: ${s.result}`); }
  if(s.rpe) p.push(`RPE ${s.rpe}`);
  if(s.intervals && s.kind !== 'gym') p.push(s.intervals);
  return p.join(' · ');
}

function updateCalc(){

  else out.textContent = '–';
  const type = (f.querySelector('input[name=stype]:checked') || {}).value || '';
  const all = f.dataset.showAll === '1';
  const iw = $('#intWrap'); if(iw) iw.hidden = !(all || /interv|mäki|vk|vauhti|fartlek|kilpa/i.test(type) || f.intervals.value.trim());
  const lw = $('#loadWrap'); if(lw) lw.hidden = !(all || /kuorma|reppu|paino/i.test(type) || f.load.value.trim());
  const sb = $('#showAllBtn'); if(sb) sb.hidden = (!iw || !iw.hidden) && (!lw || !lw.hidden);
}
function saveSession(f){
  const kind = f.dataset.kind, id = f.dataset.id;
  const s = id ? Object.assign({}, sessById(id)) : {id:uid(), createdAt:Date.now()};
  const t = f.dataset.tpl ? tplById(f.dataset.tpl) : null;
  s.kind = kind; s.templateId = f.dataset.tpl || null;
  if(!id) s.title = t ? t.name : KINDS[kind].label;
  s.date = f.date.value || todayISO();
  s.type = (f.querySelector('input[name=stype]:checked') || {}).value || '';
  s.notes = f.notes.value.trim();
  if(kind === 'gym'){
    s.exercises = $$('.ex-block', f).map(b => ({ name:b.querySelector('.ex-name').value.trim(),
      sets: $$('.set-row', b).map(r => ({reps:Math.round(num(r.querySelector('.set-reps').value) || 0), kg:num(r.querySelector('.set-kg').value) || 0})).filter(x => x.reps > 0) }))
      .filter(e => e.name && e.sets.length);
    if(!s.exercises.length){ toast('Lisää vähintään yksi liike ja sarja (toistot)', {error:true}); return; }
  }
  if(kind === 'run' || kind === 'swim'){
    const d = num(f.distance.value), dur = parseDuration(f.duration.value);
    if(f.duration.value.trim() && dur == null){ toast('Kesto ei kelpaa – käytä esim. 45:30', {error:true}); return; }
    if(!d && !dur){ toast('Anna vähintään matka tai kesto', {error:true}); return; }
    if(kind === 'run'){ s.distanceKm = d; s.loadKg = num(f.load.value); } else { s.distanceM = d; s.stroke = (f.querySelector('input[name=stroke]:checked') || {}).value || ''; }
    s.durationSec = dur; s.hr = num(f.hr.value) ? Math.round(num(f.hr.value)) : null; s.rpe = num(f.rpe.value); s.intervals = f.intervals.value.trim();
  }
  if(kind === 'func'){
    const dur = parseDuration(f.duration.value);
    if(f.duration.value.trim() && dur == null){ toast('Kesto ei kelpaa – käytä esim. 20:00', {error:true}); return; }
    s.durationSec = dur; s.rounds = num(f.rounds.value); s.movements = f.movements.value.trim(); s.result = f.result.value.trim(); s.rpe = num(f.rpe.value);
    if(!dur && !s.rounds && !s.result && !s.movements){ toast('Täytä ainakin kesto, kierrokset, liikkeet tai tulos', {error:true}); return; }
  }
  delete s.sample;
  if(id){ const i = S.sessions.findIndex(x => x.id === id); S.sessions[i] = s; } else S.sessions.push(s);
  save(); closeModal(); render(); toast(id ? 'Kirjaus päivitetty' : 'Treeni tallennettu');
}

function chartWidth(){ const m = $('#main'); const w = (m ? m.clientWidth : 390) - 32 - 34; return Math.round(Math.max(260, Math.min(660, w))); }
function niceTicks(min, max, count=4){
  if(min === max){ const d = Math.abs(min) * 0.1 || 1; min -= d; max += d; }
  const step0 = (max - min) / count, mag = Math.pow(10, Math.floor(Math.log10(step0))), n = step0 / mag;
  const step = (n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10) * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, ticks = [];
  for(let v = lo; v <= hi + step/2; v += step) ticks.push(+v.toFixed(10));
  return {lo, hi, ticks};
}
function lineChart(pts, {fmtY = v => fmtNum(v), invert = false, color = 'var(--accent)', tip = () => ''} = {}){
  if(!pts.length) return '<div class="chart-empty">Ei vielä dataa</div>';
  pts = pts.slice().sort((a, b) => a.x - b.x);
  const W = chartWidth(), H = 190, L = 44, R = 12, T = 12, B = 26;
  let x0 = pts[0].x, x1 = pts[pts.length-1].x; if(x0 === x1){ x0 -= 3*DAY; x1 += 3*DAY; }
  const ys = pts.map(p => p.y); const {lo, hi, ticks} = niceTicks(Math.min(...ys), Math.max(...ys));
  const sx = x => L + (x - x0) / (x1 - x0) * (W - L - R);
  const sy = y => { const f = (y - lo) / ((hi - lo) || 1); return invert ? T + f*(H-T-B) : H - B - f*(H-T-B); };
  let g = '';
  for(const tk of ticks){ const y = sy(tk).toFixed(1); g += `<line class="grid" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text class="axis-t" x="${L-6}" y="${(+y+4).toFixed(1)}" text-anchor="end">${esc(fmtY(tk))}</text>`; }
  const nx = Math.min(4, Math.max(2, Math.floor((W - L - R) / 80)));
  for(let i = 0; i < nx; i++){ const x = x0 + (x1 - x0) * i / (nx - 1); const d = new Date(x); g += `<text class="axis-t" x="${sx(x).toFixed(1)}" y="${H-6}" text-anchor="${i === 0 ? 'start' : i === nx-1 ? 'end' : 'middle'}">${d.getDate()}.${d.getMonth()+1}.</text>`; }
  const path = pts.map((p, i) => `${i ? 'L' : 'M'}${sx(p.x).toFixed(1)},${sy(p.y).toFixed(1)}`).join('');
  const base = H - B;
  const area = pts.length > 1 ? `<path d="${path}L${sx(pts[pts.length-1].x).toFixed(1)},${base}L${sx(pts[0].x).toFixed(1)},${base}Z" fill="${color}" opacity=".10"/>` : '';
  const dots = pts.map(p => `<circle class="pt" cx="${sx(p.x).toFixed(1)}" cy="${sy(p.y).toFixed(1)}" r="4.5" fill="var(--card)" stroke="${color}" stroke-width="2.5" data-tip="${esc(tip(p))}"><title>${esc(tip(p))}</title></circle>`).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img">${g}${area}<path d="${path}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}</svg><div class="chart-tip">Napauta pistettä nähdäksesi arvon</div></div>`;
}
function barChart(bars, {fmtY = v => fmtNum(v), color = 'var(--accent)'} = {}){
  if(!bars.length || bars.every(b => !b.value)) return '<div class="chart-empty">Ei dataa viime viikoilta</div>';
  const W = chartWidth(), H = 170, L = 40, R = 8, T = 10, B = 24;
  const {hi, ticks} = niceTicks(0, Math.max(...bars.map(b => b.value)));
  const sy = v => H - B - v / (hi || 1) * (H - T - B);
  const bw = (W - L - R) / bars.length;
  let g = '';
  for(const tk of ticks){ const y = sy(tk).toFixed(1); g += `<line class="grid" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text class="axis-t" x="${L-6}" y="${(+y+4).toFixed(1)}" text-anchor="end">${esc(fmtY(tk))}</text>`; }
  bars.forEach((b, i) => {
    const x = L + i*bw + bw*0.18, w = bw*0.64, y = sy(b.value);
    g += `<rect class="pt" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(0, H-B-y).toFixed(1)}" rx="3" fill="${color}" opacity="${b.value ? .85 : 0}" data-tip="${esc(b.tip)}"><title>${esc(b.tip)}</title></rect>`;
    g += `<text class="axis-t" x="${(L + i*bw + bw/2).toFixed(1)}" y="${H-7}" text-anchor="middle">${esc(b.label)}</text>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img">${g}</svg><div class="chart-tip">Viikkonumerot · napauta pylvästä nähdäksesi arvon</div></div>`;
}
function e1rm(kg, reps){ if(!kg || !reps) return 0; return reps === 1 ? kg : kg * (1 + reps/30); }

function kehOptions(){

function renderKehitys(){

function kehGym(sessions, tpl){
  const metrics = [['max','Paras paino'],['e1rm','Arvioitu 1RM'],['vol','Volyymi']];
  let h = `<div class="scroll-x" style="margin-bottom:8px">${metrics.map(([k, l]) => `<button type="button" class="chip-btn ${ui.kehMetric === k ? 'on' : ''}" data-action="keh-metric" data-m="${k}">${l}</button>`).join('')}</div>`;
  if(!sessions.length) return h + `<div class="card empty">Tälle treenille ei ole vielä kirjauksia.${tpl ? `<br><br><button type="button" class="btn primary" data-action="log-tpl" data-id="${tpl.id}">Kirjaa ${esc(tpl.name)}</button>` : ''}</div>`;
  const map = new Map();
  for(const e of (tpl ? tpl.exercises || [] : [])) map.set(e.name.trim().toLowerCase(), {name:e.name, rows:[]});
  for(const s of sessions) for(const e of (s.exercises||[])){
    const key = e.name.trim().toLowerCase(); if(!map.has(key)) map.set(key, {name:e.name, rows:[]});
    let max = 0, best = 0, vol = 0, maxReps = 0;
    for(const st of e.sets){ max = Math.max(max, st.kg||0); best = Math.max(best, e1rm(st.kg, st.reps)); vol += (st.reps||0)*(st.kg||0); maxReps = Math.max(maxReps, st.reps||0); }
    map.get(key).rows.push({date:s.date, x:parseISO(s.date).getTime(), sets:e.sets, max, e1rm:best, vol, maxReps});
  }
  h += `<div class="hint" style="margin:0 0 10px">${ui.kehMetric === 'max' ? 'Raskain sarjan paino kultakin kerralta.' : ui.kehMetric === 'e1rm' ? 'Arvioitu yhden toiston maksimi parhaasta sarjasta (Epley: kg × (1 + toistot/30)).' : 'Volyymi = toistot × kg kaikista sarjoista yhteensä.'} ${sessions.length} kirjausta.</div>`;
  for(const ex of map.values()){
    const rows = ex.rows;
    const bodyweight = rows.length > 0 && rows.every(r => !r.max);
    const mk = bodyweight ? 'maxReps' : ui.kehMetric;
    const unit = bodyweight ? 'toistoa' : 'kg', dec = mk === 'vol' ? 0 : 1;
    const pts = rows.map(r => ({x:r.x, y:r[mk], date:r.date}));
    let stats = '';
    if(rows.length){
      const bestRow = rows.reduce((a, b) => b[mk] > a[mk] ? b : a);
      const diff = rows[rows.length-1][mk] - rows[0][mk];
      stats = `<div class="stats"><span>Ennätys: <b>${fmtNum(bestRow[mk], dec)} ${unit}</b> (${fmtDate(bestRow.date)})</span>
        ${rows.length > 1 ? `<span>Muutos alusta: <b class="${diff > 0 ? 'up' : diff < 0 ? 'down' : ''}">${diff > 0 ? '+' : ''}${fmtNum(diff, dec)} ${unit}</b></span>` : ''}
        <span>Kertoja: <b>${rows.length}</b></span></div>`;
    }
    h += `<section class="card k-gym"><h2>${esc(ex.name)}${bodyweight ? ' <span class="tag">kehonpaino · max toistot</span>' : ''}</h2>${stats}
      ${lineChart(pts, {color:'var(--k-gym)', fmtY:v => fmtNum(v, dec), tip:p => `${fmtDate(p.date)}: ${fmtNum(p.y, dec)} ${unit}`})}
      ${rows.length ? `<details><summary class="sum">Historia (${rows.length})</summary><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Pvm</th><th>Sarjat (toistot×kg)</th><th class="num">Paras</th><th class="num">1RM</th><th class="num">Volyymi</th></tr></thead><tbody>
        ${rows.slice().reverse().map(r => `<tr><td>${fmtDate(r.date)}</td><td class="wrap">${esc(setsText(r.sets))}</td><td class="num">${fmtNum(r.max)}</td><td class="num">${fmtNum(r.e1rm)}</td><td class="num">${fmtNum(r.vol, 0)}</td></tr>`).join('')}
      </tbody></table></div></details>` : ''}
    </section>`;
  }
  return h;

/* Open Food Facts vastaa ruuhkassa 502/503/429 – yritetään automaattisesti uudelleen pienellä viiveellä */
async function withRetry(fn, signal, tries = 3){
  for(let a = 0; ; a++){
    try{ return await fn(); }
    catch(e){ if(e.busy && a < tries - 1 && !(signal && signal.aborted)){ await sleep(1200 * (a + 1), signal); continue; } throw e; }
  }
}
const r1 = v => v == null || !isFinite(v) ? null : Math.round(v * 10) / 10;
let scriptPromises = {};
function loadScript(src){
  if(!scriptPromises[src]) scriptPromises[src] = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = src; s.async = true; s.crossOrigin = 'anonymous';
    s.onload = () => res(); s.onerror = () => { delete scriptPromises[src]; s.remove(); rej(new Error('lataus epäonnistui')); };
    document.head.appendChild(s);
  });
  return scriptPromises[src];
}
function gtinValid(code){
  if(!/^\d{8}$|^\d{12,14}$/.test(code)) return false;
  const d = code.split('').map(Number), check = d.pop(); let sum = 0;
  d.reverse().forEach((x, i) => sum += x * (i % 2 === 0 ? 3 : 1));
  return (10 - sum % 10) % 10 === check;
}

  const retry = $('#scanRetry'); if(retry) retry.hidden = true;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    setScanStatus(window.isSecureContext === false ? 'Kamera toimii vain suojatun (https) yhteyden kautta. Syötä viivakoodi käsin.' : 'Tämä selain ei tue kameraa. Syötä viivakoodi käsin.', 'warn'); return;
  }
  const token = ++scan.token;
  setScanStatus('Käynnistetään kameraa…');
  let stream;
  try{ stream = await navigator.mediaDevices.getUserMedia({audio:false, video:{facingMode:{ideal:'environment'}, width:{ideal:1280}, height:{ideal:720}}}); }
  catch(e){ if(token !== scan.token) return; setScanStatus(cameraErrorText(e), 'warn'); const r = $('#scanRetry'); if(r) r.hidden = false; return; }
  const v = $('#scanVideo');
  if(token !== scan.token || !v){ stream.getTracks().forEach(t => t.stop()); return; }
  scan.stream = stream; v.srcObject = stream; $('#scanView').hidden = false;
  try{ await v.play(); } catch(e){ /* autoplay estetty – kuva voi silti päivittyä */ }
  setScanStatus('Kohdista viivakoodi punaisen viivan kohdalle…');
  try{ await prepareDecoder(); }
  catch(e){ if(token !== scan.token) return; setScanStatus('Viivakoodin lukijaa ei saatu ladattua (ei verkkoyhteyttä?). Syötä numero käsin.', 'warn'); return; }
  if(token !== scan.token) return;
  scanLoop(token);
}
async function prepareDecoder(){
  if(scan.detector || scan.zx) return;
  if('BarcodeDetector' in window){
    try{
      const fm = await BarcodeDetector.getSupportedFormats();
      const want = ['ean_13','ean_8','upc_a','upc_e'].filter(x => fm.includes(x));
      if(want.length){ scan.detector = new BarcodeDetector({formats:want}); scan.engine = 'native'; return; }
    } catch(e){ /* siirrytään varakirjastoon */ }
  }
  await loadScript(ZXING_URL);
  if(!window.ZXingBrowser) throw new Error('ZXing puuttuu');
  const BF = ZXingBrowser.BarcodeFormat, hints = new Map();
  hints.set(2 /* DecodeHintType.POSSIBLE_FORMATS */, [BF.EAN_13, BF.EAN_8, BF.UPC_A, BF.UPC_E]);
  scan.zx = new ZXingBrowser.BrowserMultiFormatOneDReader(hints); scan.engine = 'zxing';
}
async function scanLoop(token){
  if(token !== scan.token) return;
  const v = $('#scanVideo');
  if(v && v.readyState >= 2 && v.videoWidth){
    let code = null;
    try{
      if(scan.detector){ const r = await scan.detector.detect(v); if(r && r.length) code = r[0].rawValue; }
      else if(scan.zx){
        const c = scan.canvas || (scan.canvas = document.createElement('canvas'));
        const vw = v.videoWidth, vh = v.videoHeight, sh = Math.round(vh * 0.6), sy = Math.round((vh - sh) / 2), k = Math.min(1, 1000 / vw);
        c.width = Math.round(vw * k); c.height = Math.round(sh * k);
        c.getContext('2d', {willReadFrequently:true}).drawImage(v, 0, sy, vw, sh, 0, 0, c.width, c.height);
        try{ code = scan.zx.decodeFromCanvas(c).getText(); } catch(e){ /* ei koodia tässä kuvassa */ }
      }
    } catch(e){ /* yksittäinen kuva epäonnistui */ }
    if(code && /^\d{6,14}$/.test(code) && token === scan.token){
      if(navigator.vibrate) navigator.vibrate(60);
      stopScanner(); lookupProduct(code); return;
    }

}

function parseOFF(code, p){

    per100:{kcal:kcal == null ? null : Math.round(kcal), p:r1(g('proteins_100g')), c:r1(g('carbohydrates_100g')), f:r1(g('fat_100g'))},

async function fetchOFF(code){
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 15000);

    res = await withRetry(async () => {

      catch(e){ if(e.name === 'AbortError' || navigator.onLine === false) throw e; throw Object.assign(new Error('palvelu ei vastaa (ruuhka tai verkkoyhteys)'), {busy:true}); }
      if([429, 502, 503, 504].includes(r.status)) throw Object.assign(new Error('palvelu ruuhkautunut tai tilapäisesti poissa käytöstä (' + r.status + ')'), {busy:true});
      return r;
    }, ctl.signal);
  }
  catch(e){ if(e.busy) throw e; const err = new Error(e.name === 'AbortError' ? 'aikakatkaisu' : 'verkkovirhe'); err.offline = true; throw err; }
  finally{ clearTimeout(to); }

  if(!res.ok) throw new Error('palvelin vastasi ' + res.status);
  const j = await res.json();

}

const offSearchUrl = (q, fi) => `https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=20&fields=code,${OFF_FIELDS}` + (fi ? '&tagtype_0=countries&tag_contains_0=contains&tag_0=finland' : '');
const searchCache = new Map();
let searchTimer = null, searchCtl = null, searchSeq = 0;
const lc = s => String(s || '').toLowerCase();
function localSearch(q){
  const words = lc(q).split(/\s+/).filter(Boolean); if(!words.length) return [];
  const match = t => words.every(w => t.includes(w));
  const out = [], seen = new Set();
  for(const p of Object.values(S.food.products).sort((a, b) => (b.updatedAt||0) - (a.updatedAt||0))){
    if(p.name && match(lc(p.name + ' ' + (p.brand || '')))){ out.push({type:'product', code:p.code, name:p.name, brand:p.brand, kcal:p.per100 && p.per100.kcal, image:p.image, own:p.source !== 'off'}); seen.add(lc(p.name)); }
  }
  for(const e of knownFoods()){
    if(seen.has(lc(e.name)) || (e.code && S.food.products[e.code])) continue;
    if(match(lc(e.name))){ out.push({type:'food', id:e.id, name:e.name, kcal:e.kcal, grams:e.grams}); seen.add(lc(e.name)); }
  }
  return out.slice(0, 8);
}
async function offSearchReq(url, signal){
  let res;
  try{ res = await fetch(url, {signal}); }
  catch(e){ if(e.name === 'AbortError' || navigator.onLine === false) throw e; throw Object.assign(new Error('ei vastausta'), {busy:true}); }
  if([429, 502, 503, 504].includes(res.status)) throw Object.assign(new Error('ruuhka ' + res.status), {busy:true});
  if(!res.ok) throw new Error('palvelin vastasi ' + res.status);
  const j = await res.json();
  return (j.products || []).filter(p => p.code && (p.product_name_fi || p.product_name));
}
async function offSearch(q, signal){
  const key = lc(q); if(searchCache.has(key)) return searchCache.get(key);
  let list = await withRetry(() => offSearchReq(offSearchUrl(q, true), signal), signal);
  if(list.length < 5){
    try{ const w = await withRetry(() => offSearchReq(offSearchUrl(q, false), signal), signal); const seen = new Set(list.map(p => p.code)); list = list.concat(w.filter(p => !seen.has(p.code))); }
    catch(e){ if(e.name === 'AbortError' || !list.length) throw e; }
  }
  const parsed = list.slice(0, 25).map(p => parseOFF(String(p.code), p));
  searchCache.set(key, parsed); return parsed;
}
function onSearchInput(immediate){
  const inp = $('#foodSearch'), box = $('#searchResults'); if(!inp || !box) return;
  const q = inp.value.trim();
  clearTimeout(searchTimer); if(searchCtl){ searchCtl.abort(); searchCtl = null; }
  const seq = ++searchSeq;
  if(!q){ box.hidden = true; box.innerHTML = ''; return; }
  ui.searchQ = q; ui.searchLocal = localSearch(q); ui.searchOff = null;
  if(q.length < 3){ renderSearch({status:'short'}); return; }

  renderSearch({status:'loading'});
  searchTimer = setTimeout(() => runOffSearch(q, seq), immediate ? 0 : 400);
}
async function runOffSearch(q, seq){
  const ctl = searchCtl = new AbortController();
  let timedOut = false;
  const to = setTimeout(() => { timedOut = true; ctl.abort(); }, 15000);
  const slow = setTimeout(() => { if(seq === searchSeq) renderSearch({status:'slow'}); }, 4000);
  const t0 = performance.now();
  try{
    const res = await offSearch(q, ctl.signal);
    if(seq !== searchSeq) return;
    ui.searchOff = res; ui.searchMs = Math.round(performance.now() - t0); renderSearch({status:'done'});
  } catch(e){
    if(seq !== searchSeq) return;
    renderSearch({status: timedOut ? 'timeout' : e.busy ? 'busy' : (e instanceof TypeError || navigator.onLine === false) ? 'neterr' : 'error', msg:e.message});
  } finally{ clearTimeout(to); clearTimeout(slow); if(searchCtl === ctl) searchCtl = null; }
}

function exportData(){
  const data = JSON.stringify(Object.assign({app:'treeniappi', exportedAt:new Date().toISOString()}, S), null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `treeniappi-varmuuskopio-${todayISO()}.json`;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  toast('Varmuuskopio ladattu');
}
$('#importFile').addEventListener('change', async ev => {
  const file = ev.target.files[0]; ev.target.value = ''; if(!file) return;
  try{
    const obj = JSON.parse(await file.text());
    if(!obj || typeof obj !== 'object' || !(Array.isArray(obj.sessions) || Array.isArray(obj.templates) || obj.food)) throw new Error('tiedosto ei näytä Treeniapin varmuuskopiolta');
    const n = normalize(obj);
    if(!confirm(`Tuodaanko varmuuskopio?\n\n${n.templates.length} treenipohjaa, ${n.sessions.length} kirjausta, ${n.food.entries.length} ruokamerkintää.\n\nNykyiset tiedot korvataan.`)) return;
    S = n; save(); render(); toast('Tiedot tuotu');
  } catch(e){ toast('Tuonti epäonnistui: ' + e.message, {error:true}); }
});

function addSampleData(){
  removeSampleData(true);
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const T = todayISO(); let n = 0; const mk = o => Object.assign({id:uid() + (n++), sample:true, createdAt:Date.now() + n}, o);
  const t1 = mk({name:'Treeni1 – Ylävartalo', kind:'gym', exercises:[{name:'Penkkipunnerrus', target:'3×8'},{name:'Pystypunnerrus', target:'3×8'},{name:'Kulmasoutu', target:'3×10'},{name:'Leuanveto', target:'3×6'}]});
  const t2 = mk({name:'Treeni2 – Alavartalo', kind:'gym', exercises:[{name:'Takakyykky', target:'3×6'},{name:'Maastaveto', target:'3×5'},{name:'Askelkyykky', target:'3×10'},{name:'Pohjenousu', target:'3×12'}]});
  const t3 = mk({name:'Peruslenkki', kind:'run', defaultType:'PK'});
  const t4 = mk({name:'Tiistain intervallit', kind:'run', defaultType:'Intervalli', intervals:'6 × 800 m / 2 min palautus'});
  const t5 = mk({name:'Uintitreeni', kind:'swim', defaultType:'PK-uinti'});
  const t6 = mk({name:'Kehonpainopiiri', kind:'func', defaultType:'AMRAP', movements:'10 burpeeta\n15 kahvakuulaheilautusta\n20 kyykkyä\n10 punnerrusta'});
  S.templates.push(t1, t2, t3, t4, t5, t6);
  const start = mondayOf(addDays(T, -7*9));
  const gymEx = (base, step, i, reps, slow) => { const kg = base + step * Math.floor(i * (slow ? 0.3 : 0.45)); return [{reps, kg}, {reps, kg}, {reps:Math.max(1, reps - (rnd() < .5 ? 1 : 0)), kg}]; };
  for(let w = 0; w < 10; w++){
    const mon = addDays(start, 7*w), i = w*2;
    const push = (dayOff, o) => { const date = addDays(mon, dayOff); if(date <= T) S.sessions.push(mk(Object.assign({date}, o))); };
    push(0, {kind:'gym', templateId:t1.id, title:t1.name, type:'Voima', exercises:[
      {name:'Penkkipunnerrus', sets:gymEx(60, 2.5, i, 8)}, {name:'Pystypunnerrus', sets:gymEx(35, 2.5, i, 8, true)},
      {name:'Kulmasoutu', sets:gymEx(50, 2.5, i, 10)}, {name:'Leuanveto', sets:[{reps:5 + Math.floor(w/3), kg:0},{reps:5 + Math.floor(w/3), kg:0},{reps:4 + Math.floor(w/3), kg:0}]}]});
    push(3, {kind:'gym', templateId:t2.id, title:t2.name, type:'Voima', exercises:[
      {name:'Takakyykky', sets:gymEx(70, 5, i, 6)}, {name:'Maastaveto', sets:gymEx(90, 5, i, 5, true)},
      {name:'Askelkyykky', sets:gymEx(16, 2, i, 10, true)}, {name:'Pohjenousu', sets:gymEx(60, 5, i, 12, true)}]});
    const pkKm = 7 + Math.round(rnd()*30)/10, pkPace = 372 - w*2.2 + rnd()*8;
    push(1, {kind:'run', templateId:t3.id, title:t3.name, type:'PK', distanceKm:pkKm, durationSec:Math.round(pkKm*pkPace), hr:Math.round(138 - w*0.6 + rnd()*4), rpe:3});
    if(w % 2 === 0) push(2, {kind:'run', templateId:t4.id, title:t4.name, type:'Intervalli', intervals:'6 × 800 m / 2 min palautus', distanceKm:8.2, durationSec:Math.round(8.2*(330 - w*2 + rnd()*6)), hr:Math.round(156 + rnd()*5), rpe:8});
    else push(2, {kind:'run', title:'Juoksu', type:'Vauhtikestävyys (VK)', intervals:'3 × 10 min / 2 min', distanceKm:10, durationSec:Math.round(10*(318 - w*1.5 + rnd()*6)), hr:Math.round(152 + rnd()*4), rpe:7});
    if(w % 3 === 1) push(6, {kind:'run', title:'Juoksu', type:'Kuormajuoksu', distanceKm:6, durationSec:Math.round(6*(430 - w*2)), loadKg:10, hr:144, rpe:6, notes:'Reppu 10 kg'});
    else push(6, {kind:'run', title:'Juoksu', type:'Pitkä lenkki', distanceKm:14 + w*0.5, durationSec:Math.round((14 + w*0.5)*(385 - w)), hr:Math.round(140 + rnd()*4), rpe:5});
    const sm = 1200 + Math.round(rnd()*8)*100, st = ['PK-uinti','Tekniikka','Intervalli'][w % 3];
    push(4, {kind:'swim', templateId:t5.id, title:t5.name, type:st, distanceM:sm, durationSec:Math.round(sm/100*(132 - w*1.2 + rnd()*5)), stroke:'Vapaa', intervals:st === 'Intervalli' ? '10 × 100 m / 20 s palautus' : ''});
    if(w % 2 === 1) push(5, {kind:'func', templateId:t6.id, title:t6.name, type:'AMRAP', durationSec:1200, rounds:5 + Math.floor(w/3), movements:t6.movements, result:`${5 + Math.floor(w/3)} kierrosta + ${Math.floor(rnd()*20)} toistoa`, rpe:8});
  }
  const foods = [['Kaurapuuro marjoilla',380,14,62,8,'aamiainen'],['Kahvi maidolla',40,2,3,2,'aamiainen'],['Kanasalaatti',520,42,30,22,'lounas'],['Rahka + banaani',260,22,38,1,'valipala'],['Lohi, peruna ja kasvikset',680,40,60,28,'paivallinen'],['Proteiinipatukka',210,20,18,7,'valipala']];
  for(const [dOff, picks] of [[-1, [0,1,2,3,4]], [0, [0,1,2,5]]]) for(const k of picks){ const f = foods[k]; S.food.entries.push({id:uid() + (n++), sample:true, date:addDays(T, dOff), name:f[0], kcal:f[1], p:f[2], c:f[3], f:f[4], meal:f[5], t:Date.now() - 1000*k}); S.food.entries[S.food.entries.length-1].meal = S.food.meals.some(x => x.id === f[5]) ? f[5] : S.food.meals[0].id; }
  save();
}
function removeSampleData(silent){
  const sampleTpl = new Set(S.templates.filter(t => t.sample).map(t => t.id));
  S.templates = S.templates.filter(t => !t.sample);
  S.sessions = S.sessions.filter(s => !s.sample).map(s => sampleTpl.has(s.templateId) ? Object.assign(s, {templateId:null}) : s);
  S.food.entries = S.food.entries.filter(e => !e.sample);
  if(!silent) save();
}

    if(t.closest('#modal')) render(); }
  else if(t.id === 'foodName'){ const k = t.value.trim().toLowerCase(); const m = knownFoods().find(x => x.name.trim().toLowerCase() === k); const f = t.form;
    if(m && !f.kcal.value){ f.kcal.value = inNum(m.kcal); f.p.value = inNum(m.p); f.c.value = inNum(m.c); f.fat.value = inNum(m.f); } }
});
document.addEventListener('input', e => { if(e.target.id === 'foodSearch') onSearchInput(false); else if(e.target.closest('#logForm')) updateCalc(); else if(e.target.closest('#prodForm')) updateProdCalc(); else if(e.target.id === 'codeInput') e.target.value = e.target.value.replace(/\D/g, ''); });
document.addEventListener('keydown', e => {
  if(e.key === 'Enter' && e.target.matches('input[data-addfor]')){ e.preventDefault(); ACTIONS['type-add']({dataset:{k:e.target.dataset.addfor}}); }
  if(e.key === 'Enter' && e.target.id === 'customType'){ e.preventDefault(); ACTIONS['type-custom-add'](); }
  if(e.key === 'Enter' && e.target.classList.contains('meal-name')){ e.preventDefault(); e.target.blur(); }
});
window.addEventListener('storage', e => { if(e.key === STORE_KEY){ S = load(); render(); } });

route();
</script>
</body>
</html>
