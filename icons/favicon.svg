<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Treeniäppi, vaihtoehto 1: käsipaino. Täysi neliötausta (iOS pyöristää itse). -->
  <defs><clipPath id="r"><rect width="1024" height="1024" rx="230"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/><stop offset=".55" stop-color="#14b8a6"/><stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#042f2e" flood-opacity=".35"/></filter>
  </defs>
  <g clip-path="url(#r)">
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#hl)"/>
  <g transform="translate(512 512) scale(.9) rotate(-30) translate(-512 -512)" filter="url(#sh)" fill="#fff">
    <rect x="300" y="476" width="424" height="72" rx="20"/>
    <rect x="228" y="318" width="104" height="388" rx="34"/>
    <rect x="692" y="318" width="104" height="388" rx="34"/>
    <rect x="150" y="380" width="72" height="264" rx="28"/>
    <rect x="802" y="380" width="72" height="264" rx="28"/>
  </g>

  </g>
</svg>
